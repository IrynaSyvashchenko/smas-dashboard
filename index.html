<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SMAS-ліфтинг · Дашборд реклами</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1420;--card:#1a2130;--card2:#212a3d;--txt:#e8ecf4;--mut:#8b96ab;--acc:#4f8cff;--good:#3ecf8e;--warn:#f5b942;--bad:#ff6b6b;--border:#2a3550}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;padding:20px;max-width:1200px;margin:0 auto}
h1{font-size:1.5rem;margin-bottom:4px}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:14px}
h2{font-size:1.1rem;margin:28px 0 12px;color:var(--acc)}
.today{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:.85rem;color:var(--mut);margin-bottom:18px}
.today b{color:var(--txt)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--card);border:1px solid var(--border);color:var(--mut);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:.88rem;font-family:inherit}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.phint{color:var(--mut);font-size:.78rem;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.card h3{font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.city{font-size:.7rem;color:var(--mut);background:var(--card2);padding:2px 8px;border-radius:10px}
.big{font-size:1.6rem;font-weight:700;margin:8px 0 2px}
.big small{font-size:.75rem;color:var(--mut);font-weight:400}
.row{display:flex;justify-content:space-between;font-size:.82rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.row:last-child{border:none}
.row .l{color:var(--mut)}
.chartbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.chartbox h3{font-size:.95rem;margin-bottom:10px;color:var(--txt)}
canvas{max-height:340px}
table{width:100%;border-collapse:collapse;font-size:.82rem;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
th{background:var(--card2);color:var(--mut);font-weight:600}
tr:hover td{background:var(--card2)}
.tag{padding:1px 7px;border-radius:8px;font-size:.72rem}
.g{background:rgba(62,207,142,.15);color:var(--good)}
.y{background:rgba(245,185,66,.15);color:var(--warn)}
.r{background:rgba(255,107,107,.15);color:var(--bad)}
.alert{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--bad);border-radius:10px;padding:9px 13px;margin-bottom:7px;font-size:.85rem}
.alert.warn{border-left-color:var(--warn)}
.alert.ok{border-left-color:var(--good);color:var(--mut)}
.foot{color:var(--mut);font-size:.75rem;margin-top:24px;text-align:center}
@media(max-width:600px){body{padding:10px}.big{font-size:1.3rem}}
</style>
</head>
<body>
<h1>📊 SMAS-ліфтинг · Париж і Прага</h1>
<div class="sub" id="updated">Завантаження…</div>

<div class="today" id="todayStrip"></div>

<h2>⚠️ Алерти</h2>
<div id="alerts"></div>

<h2>По менеджерах</h2>
<div class="tabs" id="tabs"></div>
<div class="phint" id="phint"></div>
<div class="cards" id="cards"></div>

<h2>Динаміка</h2>
<div class="chartbox"><h3>Ціна ліда (CPL) по днях, $</h3><canvas id="cplChart"></canvas></div>
<div class="chartbox"><h3>Ліди по днях</h3><canvas id="leadsChart"></canvas></div>
<div class="chartbox"><h3>Витрати по днях, $</h3><canvas id="spendChart"></canvas></div>

<h2 id="crTitle">Креативи</h2>
<div class="chartbox"><h3>Ціна запису (CPA) по креативах, $</h3><canvas id="cpaChart"></canvas></div>
<div style="overflow-x:auto"><table id="crTable">
<thead><tr><th>Креатив · ед сет</th><th>Менеджер</th><th>Витрати</th><th>Ліди</th><th>CPL</th><th>CTR</th><th>Частота</th><th>Записи</th><th>CPA</th></tr></thead>
<tbody></tbody></table></div>
<div class="phint" id="crNote"></div>

<div class="foot" id="foot"></div>

<script>
const COLORS={'Диана':'#4f8cff','Таня':'#3ecf8e','Алиса':'#f5b942','Саида':'#ff6b6b','Максим':'#ff6b6b','Даша':'#b47fff'};
const MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const fmt=(v,d=2)=>v==null||isNaN(v)?'—':'$'+Number(v).toFixed(d);
const dd=s=>s.slice(8,10)+'.'+s.slice(5,7);
const addD=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
Chart.defaults.color='#8b96ab';Chart.defaults.borderColor='#2a3550';

fetch('data.json?t='+Date.now()).then(r=>r.json()).then(D=>{
  document.getElementById('updated').textContent='Оновлено: '+new Date(D.updated).toLocaleString('uk-UA')+' · '+D.periodNote;
  document.getElementById('crTitle').textContent='Креативи ('+D.creativesPeriod+')';

  const M=D.managers;
  const allDates=[...new Set(Object.values(M).flatMap(m=>m.dates))].sort();
  const today=allDates[allDates.length-1];
  const yest=addD(today,-1);
  const d7from=addD(today,-6);
  const monthPref=today.slice(0,7);
  const monthName=MONTHS[parseInt(today.slice(5,7),10)-1];

  // ---- сьогодні: окрема чесна смужка (день ще неповний) ----
  const sumAll=(key,pred)=>Object.values(M).reduce((s,m)=>s+m.dates.reduce((a,d,i)=>a+(pred(d)?(m[key][i]||0):0),0),0);
  const tLeads=sumAll('leads',d=>d===today), tSpend=sumAll('spend',d=>d===today);
  const tNew=Object.values(M).reduce((s,m)=>s+(m.bookings1d??0),0);
  const tOld=Object.values(M).reduce((s,m)=>s+(m.bookingsOld1d??0),0);
  document.getElementById('todayStrip').innerHTML=
    `⏳ <b>Сьогодні (${dd(today)}) — день ще неповний</b>, дані Meta і записи доходять із затримкою: `+
    `ліди <b>${tLeads}</b> · витрати <b>${fmt(tSpend)}</b> · записи сьогодні: <b>${tNew}</b> нових + <b>${tOld}</b> зі старих. `+
    `Для рішень дивись «Вчора» — це перший повний день.`;

  // ---- періоди ----
  const P={
    yest:{label:'Вчора',qk:'yest',hint:`Повний закритий день — ${dd(yest)}. Найчесніші цифри для рішень.`,
          pred:d=>d===yest, bk:m=>m.bookingsYest??0,
          extra:m=>`<div class="row"><span class="l">Дата</span><b>${dd(yest)}</b></div>`},
    d7:{label:'7 днів',qk:'d7',hint:`${dd(d7from)} – ${dd(today)} (включно з неповним сьогодні).`,
          pred:d=>d>=d7from, bk:m=>m.bookings7d??0,
          extra:m=>`<div class="row"><span class="l">Днів у періоді</span><b>${m.dates.filter(d=>d>=d7from).length}</b></div>`},
    month:{label:monthName,qk:'month',hint:`Календарний місяць — те, що йде у звіт для керівництва.`,
          pred:d=>d.startsWith(monthPref), bk:m=>m.bookingsMonth??0,
          extra:m=>`<div class="row"><span class="l">Днів у місяці</span><b>${m.dates.filter(d=>d.startsWith(monthPref)).length}</b></div>`},
    all:{label:'Весь час',qk:'all',hint:`Від старту кожного менеджера. Періоди різні — порівнювати менеджерів між собою тут не можна.`,
          pred:d=>true, bk:m=>m.bookings??0,
          extra:m=>(m.instSpend?`<div class="row"><span class="l">+ Instagram (Direct)</span><b>${fmt(m.instSpend)}</b></div>`:'')+
                   `<div class="row"><span class="l">З</span><b>${dd(m.start)}</b></div>`}
  };

  // якість трафіку: нецільові (гео/сміття) · без реакції (людина не відповіла) · ліквід (вийшли на контакт)
  const qualityRows=(m,p,sp,ld)=>{
    const q=m.q&&m.q[p.qk];
    if(!q||!q.leads) return '';
    const liq=Math.max(q.leads-q.bad-(q.noresp||0),0);
    const badR=q.bad/q.leads, nrR=(q.noresp||0)/q.leads, liqR=liq/q.leads;
    const cplLiq=(ld&&liqR>0)?sp/(ld*liqR):null;   // ціна ліда, який реально вийшов на контакт
    const cls=r=>r>=.2?'r':r>=.1?'y':'g';
    return `<div class="row"><span class="l">Нецільові (гео/сміття)</span><b><span class="tag ${cls(badR)}">${q.bad} · ${Math.round(badR*100)}%</span></b></div>
            <div class="row"><span class="l">Без реакції</span><b><span class="tag ${nrR>=.4?'r':nrR>=.25?'y':'g'}">${q.noresp||0} · ${Math.round(nrR*100)}%</span></b></div>
            <div class="row"><span class="l">Ліквід (на контакті)</span><b><span class="tag ${liqR>=.5?'g':liqR>=.3?'y':'r'}">${liq} · ${Math.round(liqR*100)}%</span></b></div>
            <div class="row"><span class="l">CPL ліквіда</span><b>${fmt(cplLiq)}</b></div>`;
  };

  const tabsEl=document.getElementById('tabs');
  Object.keys(P).forEach(k=>{
    const b=document.createElement('button');
    b.className='tab'+(k==='yest'?' on':''); b.textContent=P[k].label; b.dataset.k=k;
    b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(k)};
    tabsEl.appendChild(b);
  });

  // метрики Meta: CTR / CPM / частота (частота >2.5 = вигорання)
  const metaRows=(m,p)=>{
    const x=m.m&&m.m[p.qk];
    if(!x) return '';
    const f=x.freq, fcls=f==null?'g':(f>=2.5?'r':f>=1.8?'y':'g');
    return `<div class="row"><span class="l">CTR</span><b>${x.ctr!=null?x.ctr+'%':'—'}</b></div>
            <div class="row"><span class="l">CPM</span><b>${fmt(x.cpm)}</b></div>
            <div class="row"><span class="l">Частота</span><b><span class="tag ${fcls}">${f??'—'}</span></b></div>`;
  };

  function buildAlerts(k){
    const A=[];
    for(const [name,m] of Object.entries(M)){
      const x=m.m&&m.m[k], q=m.q&&m.q[k];
      if(x&&x.freq!=null&&x.freq>=2.5)
        A.push(['bad',`<b>${name}</b>: частота <b>${x.freq}</b> — аудиторія бачить рекламу забагато разів, креативи вигорають. Онови креатив або розшир аудиторію.`]);
      if(q&&q.leads>=10){
        const nr=(q.noresp||0)/q.leads, bd=q.bad/q.leads;
        if(nr>=.5) A.push(['bad',`<b>${name}</b>: <b>${Math.round(nr*100)}%</b> лідів взагалі не відповідають — креатив/офер тягне незацікавлених. Це не менеджер.`]);
        if(bd>=.2) A.push(['warn',`<b>${name}</b>: <b>${Math.round(bd*100)}%</b> нецільових (не з міста / сміттєвий номер) — перевір гео і радіус в ад-сетах.`]);
      }
    }
    for(const c of (D.creatives||[])){
      if(c.freq!=null&&c.freq>=2.5)
        A.push(['bad',`Креатив <b>${c.name}</b> · ${c.adset} (${c.m}): частота <b>${c.freq}</b> — вигорів.`]);
      if(c.spend>=5&&c.leads===0)
        A.push(['bad',`Креатив <b>${c.name}</b> (${c.m}): витрачено <b>${fmt(c.spend)}</b>, <b>0 лідів</b> — вимикай.`]);
    }
    const el=document.getElementById('alerts');
    el.innerHTML = A.length
      ? A.map(([t,txt])=>`<div class="alert ${t==='warn'?'warn':''}">${txt}</div>`).join('')
      : `<div class="alert ok">✅ Критичних проблем немає: частота в нормі, креативів без лідів немає.</div>`;
  }

  function render(k){
    const p=P[k], el=document.getElementById('cards');
    document.getElementById('phint').textContent=p.hint;
    buildAlerts(k);
    el.innerHTML='';
    for(const [name,m] of Object.entries(M)){
      let sp=0,ld=0;
      m.dates.forEach((d,i)=>{ if(p.pred(d)){ sp+=m.spend[i]||0; ld+=m.leads[i]||0; } });
      sp=Math.round(sp*100)/100;
      const bk=p.bk(m);
      const cpl=ld?sp/ld:null, cpa=bk?sp/bk:null, conv=ld?Math.round(bk/ld*1000)/10+'%':'—';
      el.insertAdjacentHTML('beforeend',`<div class="card">
        <h3>${name} <span class="city">${m.city}</span></h3>
        <div class="big">${fmt(cpl)} <small>за ліда</small></div>
        <div class="row"><span class="l">Витрати</span><b>${fmt(sp)}</b></div>
        <div class="row"><span class="l">Ліди</span><b>${ld}</b></div>
        <div class="row"><span class="l">Записи</span><b>${bk}</b></div>
        <div class="row"><span class="l">CPA (запис)</span><b>${fmt(cpa)}</b></div>
        <div class="row"><span class="l">Конверсія</span><b>${conv}</b></div>
        ${qualityRows(m,p,sp,ld)}
        ${metaRows(m,p)}
        ${p.extra(m)}
      </div>`);
    }
  }
  render('yest');

  // ---- графіки ----
  const mkDs=key=>Object.entries(M).map(([n,m])=>({label:n,data:allDates.map(d=>{const i=m.dates.indexOf(d);return i<0?null:m[key][i]}),borderColor:COLORS[n],backgroundColor:COLORS[n],tension:.3,spanGaps:true,pointRadius:2}));
  new Chart(cplChart,{type:'line',data:{labels:allDates.map(dd),datasets:mkDs('cpl')},options:{interaction:{mode:'index',intersect:false}}});
  new Chart(leadsChart,{type:'line',data:{labels:allDates.map(dd),datasets:mkDs('leads')},options:{interaction:{mode:'index',intersect:false}}});
  new Chart(spendChart,{type:'line',data:{labels:allDates.map(dd),datasets:mkDs('spend')},options:{interaction:{mode:'index',intersect:false}}});

  // ---- креативи ----
  const cr=[...D.creatives].sort((a,b)=>(a.cpa??1e9)-(b.cpa??1e9));
  new Chart(cpaChart,{type:'bar',data:{labels:cr.map(c=>c.name+' · '+c.m),datasets:[{label:'CPA $',data:cr.map(c=>c.cpa),backgroundColor:cr.map(c=>COLORS[c.m])}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}});
  const tb=document.querySelector('#crTable tbody');
  for(const c of cr){
    const noBk=(c.book==null);
    const cls=noBk?'':(c.cpa==null?'r':(c.cpa<8?'g':c.cpa<15?'y':'r'));
    const st=noBk?'':(c.cpa==null?'без записів':(c.cpa<8?'топ':c.cpa<15?'норма':'дорого'));
    const fcls=c.freq==null?'':(c.freq>=2.5?'r':c.freq>=1.8?'y':'g');
    tb.insertAdjacentHTML('beforeend',`<tr>
      <td>${c.name} · ${c.adset}</td><td>${c.m}</td>
      <td>${fmt(c.spend)}</td><td>${c.leads}</td><td>${fmt(c.cpl)}</td>
      <td>${c.ctr!=null?c.ctr+'%':'—'}</td>
      <td>${c.freq!=null?`<span class="tag ${fcls}">${c.freq}</span>`:'—'}</td>
      <td>${noBk?'—*':c.book}</td>
      <td>${noBk?'—*':`${fmt(c.cpa)} <span class="tag ${cls}">${st}</span>`}</td></tr>`);
  }
  if(cr.some(c=>c.book==null)){
    const miss=[...new Set(cr.filter(c=>c.book==null).map(c=>c.m))].join(', ');
    document.getElementById('crNote').textContent=
      `* Записи/CPA по креативах ще недоступні для: ${miss} — їхні сирі вкладки Windsor поки не синхронізував. Підтягнеться саме.`;
  }
  document.getElementById('foot').innerHTML='Ліди таргетолога Ірини · Записи в періоді = записи серед лідів, <b>створених</b> у цьому періоді (запис приходить на лід через 1–5 днів, тому за 1 день їх майже завжди мало)<br>'+
    'Воронка ліда: <b>Нецільові</b> (не з міста / номер не існує / нема WhatsApp / дубль) → проблема <b>таргетингу</b>. '+
    '<b>Без реакції</b> (не прочитав, не взяв слухавку, ігнор) → людина лишила номер і зникла: проблема <b>креативу/оферу</b>, а не менеджера. '+
    '<b>Ліквід</b> = реально вийшли на контакт. <b>CPL ліквіда</b> = скільки коштує лід, який справді відповів.<br>'+
    'CPA рахується від витрат лід-форм (Instagram Direct показано окремо) · Дані: Meta Ads (Windsor) + Google-таблиця';
}).catch(e=>{document.getElementById('updated').textContent='Помилка завантаження даних: '+e.message});
</script>
</body>
</html>
