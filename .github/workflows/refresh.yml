name: Refresh dashboard data

# Runs in GitHub's cloud, every 2 hours, 24/7 — independent of any computer.
on:
  schedule:
    - cron: "0 */2 * * *"      # every 2 hours (UTC)
  workflow_dispatch: {}        # allows a manual "Run workflow" click

permissions:
  contents: write              # needed to commit data.json back

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data.json from Windsor
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python refresh_dashboard.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "auto: data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "data.json unchanged — nothing to commit"
          fi

