name: Refresh dashboard data

# Runs in GitHub's cloud, every 2 hours, 24/7 — independent of any computer.
on:
  schedule:
                - cron: "25 5-17/2,20 * * *"  # every 2h ~07:25-19:25 Prague + ~22:25; minute !=0, bo GitHub dropaye cron na :00 (26-27.08 propusk ranku)
  workflow_dispatch: {}        # allows a manual "Run workflow" click

permissions:
  contents: write              # needed to commit data.json back

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data.json (Meta via Windsor, sheets via Apps Script bridge)
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_KEY: ${{ secrets.SHEETS_KEY }}
        run: python refresh_dashboard.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "auto: data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
