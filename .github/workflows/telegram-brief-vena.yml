name: Telegram brief vena
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh vena dashboard (ad5)"]
    types: [completed]
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send Telegram brief (vena)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_brief_vena.py
