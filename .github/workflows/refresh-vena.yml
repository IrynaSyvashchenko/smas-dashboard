name: Refresh vena dashboard (ad5)

# Два незалежні тригери:
#  1) власний розклад кожні 2 год — GitHub реально відпрацьовує ~6-7 слотів з 12,
#     вранці регулярно дірка 6+ год (04:30 -> 10:30 UTC);
#  2) ланцюжок від головного дашборда — його розклад надійніший, тож vena
#     оновлюється одразу після кожного "Refresh dashboard data".
#  Зворотний зв'язок (08.10): GitHub губить ранкові слоти головного refresh (дані стоять
#  з ~02:00 до ~14:00 Праги). Плановий запуск vena вдень перевіряє вік головного data.json
#  і, якщо він старший 100 хв, сам запускає "Refresh dashboard data" (workflow_dispatch).
#  Лише з schedule і лише 03..16 UTC: без циклів і без впливу на вечірні брифи.
on:
  schedule:
    - cron: "15 */2 * * *"     # зсув на :15, щоб не штовхатися з головним refresh
  workflow_run:
    workflows: ["Refresh dashboard data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write               # щоб підштовхнути головний refresh, коли його розклад пропав

concurrency:
  group: vena-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh vena/data.json
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_KEY: ${{ secrets.SHEETS_KEY }}
        run: python refresh_vena.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain vena/data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add vena/data.json
            git commit -m "auto: vena data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "vena/data.json unchanged"
          fi

      - name: Kick main refresh if its schedule was skipped
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$((10#$(date -u +%H)))
          AGE=$(python -c "import json,datetime as d;u=d.datetime.fromisoformat(json.load(open('data.json',encoding='utf-8'))['updated']);print(int((d.datetime.now(d.timezone.utc)-u).total_seconds()//60))")
          LAST=$(gh run list --workflow refresh.yml --limit 1 --json status --jq '.[0].status' || echo unknown)
          echo "UTC hour $H, main data.json age ${AGE} min, last main run: $LAST"
          if [ "$H" -ge 3 ] && [ "$H" -le 16 ] && [ "$AGE" -ge 100 ] && [ "$LAST" != "in_progress" ] && [ "$LAST" != "queued" ]; then
            gh workflow run refresh.yml --ref main && echo "main refresh dispatched"
          else
            echo "main refresh not needed"
          fi
