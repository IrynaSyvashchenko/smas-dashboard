name: Telegram brief
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh dashboard data"]
    types: [completed]

permissions:
  contents: write              # комітимо brief_sent_smas.txt — бриф раз на день

concurrency:                   # по черзі: наступний запуск бачить мітку попереднього
  group: telegram-brief-smas
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send Telegram brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_brief.py
      - name: Remember sent day
        run: |
          if [ -n "$(git status --porcelain brief_sent_smas.txt)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add brief_sent_smas.txt
            git commit -m "auto: telegram brief sent $(cat brief_sent_smas.txt)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 5
            done
          fi
